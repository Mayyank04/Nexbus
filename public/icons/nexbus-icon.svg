  <polygon points="256,70 276,140 236,140" fill="#F5F0E6"/>
  <!-- Monogram N -->
  <text x="256" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" fill="#F5F0E6" text-anchor="middle" dominant-baseline="central">N</text>
  <!-- Transit Hub Dots -->
  <circle cx="256" cy="96" r="12" fill="#F5F0E6"/>
  <circle cx="366" cy="256" r="12" fill="#F5F0E6"/>
  <circle cx="256" cy="416" r="12" fill="#F5F0E6"/>
  <circle cx="146" cy="256" r="12" fill="#F5F0E6"/>
</svg>
